services:
  web:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - media:/app/media
      - static:/app/staticfiles
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - db
      - redis

  beat:
    build:
      context: ./backend
      target: dev
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      target: dev
    command: pnpm --filter web dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - web

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jaqyn}
      POSTGRES_USER: ${POSTGRES_USER:-jaqyn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jaqyn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
  media:
  static:
