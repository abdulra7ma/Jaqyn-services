{% extends "emails/_base.html" %}
{% block title %}{{ subject }}{% endblock %}
{% block content %}
<h1>{{ greeting }}</h1>
<p>{{ body1|safe }}</p>
<p>{{ body2 }}</p>
<a class="btn" href="{{ activation_url }}">{{ button }}</a>
<p>{{ expiry|safe }}</p>
<div class="footer">
  <p>{{ footer_fallback }}</p>
  <p class="link-fallback">{{ activation_url }}</p>
</div>
{% endblock %}
